services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: workstudy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-workstudy}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend (Express + Prisma) ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: workstudy_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:         8000
      NODE_ENV:     production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-workstudy}?schema=public

      # JWT
      JWT_SECRET:     ${JWT_SECRET:-workstudy_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # CORS
      FRONTEND_URL: http://localhost

      # Auto-verify email (true = registration works without Gmail setup)
      AUTO_VERIFY: ${AUTO_VERIFY:-true}

      # Gmail SMTP (optional — needed for real email sending)
      GMAIL_USER:         ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}

      # Cloudinary (optional — needed for avatar/resume uploads)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY:    ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

      # Telegram Bot (optional — needed for notifications)
      TELEGRAM_BOT_TOKEN:    ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-WorkStudyBot}

    ports:
      - "8000:8000"

  # ── Frontend (React → Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: workstudy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
