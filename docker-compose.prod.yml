# ПРОДАКШН / ДЕПЛОЙ НА СЕРВЕР
# Запускает всё: базу, бэкенд, фронтенд.
#
# Команда: docker-compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    container_name: workstudy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workstudy}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: workstudy_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-workstudy}?schema=public
      JWT_SECRET: ${JWT_SECRET:-workstudy_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: workstudy_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
